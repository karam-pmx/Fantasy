name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Bore" 2>$null | Out-Null
          netsh advfirewall firewall add rule name="RDP-Bore" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install bore CLI
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "x86_64-pc-windows-msvc\.tar\.gz$" } | Select-Object -First 1
          if (-not $asset) {
              Write-Error "Could not find Windows x86_64 bore release asset."
              exit 1
          }

          $archivePath = "$env:RUNNER_TEMP\bore.tar.gz"
          $extractDir = "$env:RUNNER_TEMP\bore_extract"
          $installDir = "$env:RUNNER_TEMP\bore_bin"

          New-Item -ItemType Directory -Path $extractDir, $installDir -Force | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          tar -xzf $archivePath -C $extractDir

          $boreExe = Get-ChildItem -Path $extractDir -Filter "bore.exe" -Recurse | Select-Object -First 1
          if (-not $boreExe) {
              Write-Error "bore.exe not found inside downloaded archive."
              exit 1
          }

          Move-Item -Path $boreExe.FullName -Destination "$installDir\bore.exe" -Force
          echo "$installDir" >> $env:GITHUB_PATH

      - name: Start bore Tunnel and Verify RDP
        shell: pwsh
        run: |
          $borePath = Join-Path "$env:RUNNER_TEMP\bore_bin" "bore.exe"
          $stdoutLog = "$env:RUNNER_TEMP\bore.out.log"
          $stderrLog = "$env:RUNNER_TEMP\bore.err.log"

          $proc = Start-Process -FilePath $borePath `
            -ArgumentList @("local", "3389", "--to", "bore.pub") `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru `
            -NoNewWindow

          $remotePort = $null
          for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                  Write-Error "bore exited prematurely. Stderr: $(Get-Content $stderrLog -Raw)"
                  exit 1
              }
              $combined = ""
              if (Test-Path $stdoutLog) { $combined += (Get-Content $stdoutLog -Raw) }
              if (Test-Path $stderrLog) { $combined += "`n" + (Get-Content $stderrLog -Raw) }

              if ($combined -match "remote_port=(\d+)" -or $combined -match "bore\.pub:(\d+)") {
                  $remotePort = $Matches[1]
                  break
              }
              Start-Sleep -Seconds 1
          }

          if (-not $remotePort) {
              Write-Error "Timed out waiting for bore.pub to assign a remote port."
              exit 1
          }

          # Verify local RDP listener first
          $localCheck = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
          if (-not $localCheck.TcpTestSucceeded) {
              Write-Error "Local TCP port 3389 is not listening."
              exit 1
          }

          # Verify public bore tunnel endpoint
          $remoteCheck = Test-NetConnection -ComputerName "bore.pub" -Port ([int]$remotePort)
          if (-not $remoteCheck.TcpTestSucceeded) {
              Write-Error "Tunnel test to bore.pub:$remotePort failed."
              exit 1
          }

          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  bore.pub:$remotePort"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================="
          Write-Host ""

          while (-not $proc.HasExited) {
              Write-Host "[$(Get-Date -Format 'u')] Tunnel active at bore.pub:$remotePort"
              Start-Sleep -Seconds 300
          }

          Write-Error "bore process exited unexpectedly."
          exit 1
